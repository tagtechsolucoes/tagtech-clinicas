services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tagtech
      POSTGRES_PASSWORD: tagtech
      POSTGRES_DB: tagtech_clinicas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tagtech -d tagtech']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - '6379:6379'
volumes:
  pgdata:
