<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#163f4d" />
    <title>Sem conexão · TagClin</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #163f4d;
        color: #f2f5f6;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 20px 0 8px;
      }
      p {
        margin: 0 auto;
        max-width: 30ch;
        opacity: 0.75;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 22px;
        border-radius: 12px;
        background: #e9a23b;
        color: #163f4d;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icone.svg" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>Confira o Wi-Fi ou o cabo. Assim que a conexão voltar, é só tentar de novo.</p>
      <a href="/">Tentar de novo</a>
    </main>
  </body>
</html>
